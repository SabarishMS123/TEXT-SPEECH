<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeakEasy - Your Interactive Text Reader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>SpeakEasy</h1>
            <p class="tagline">Listen to your words come alive.</p>
        </header>

        <main>
            <div class="input-area">
                <label for="textInput" class="visually-hidden">Enter text to speak</label>
                <textarea id="textInput" placeholder="Type or paste your text here..."></textarea>
            </div>

            <div class="controls">
                <div class="voice-options">
                    <label for="voiceSelect">Voice:</label>
                    <select id="voiceSelect"></select>
                </div>
                <div class="rate-pitch">
                    <div class="rate-control">
                        <label for="rateSlider">Speed:</label>
                        <input type="range" id="rateSlider" min="0.5" max="2" value="1" step="0.1">
                        <span id="rateValue">1.0x</span>
                    </div>
                    <div class="pitch-control">
                        <label for="pitchSlider">Pitch:</label>
                        <input type="range" id="pitchSlider" min="0.5" max="2" value="1" step="0.1">
                        <span id="pitchValue">1.0</span>
                    </div>
                </div>
                <button id="speakButton" class="action-button">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                    </svg>
                    Speak
                </button>
                <button id="stopButton" class="action-button secondary">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v14zm2-12h8v10H8V7z"/>
                    </svg>
                    Stop
                </button>
            </div>
        </main>

        <footer>
            <p>&copy; 2025 SpeakEasy - Crafted with care.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
